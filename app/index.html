<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Healthy Habits</title>
  <meta name="description" content="Track healthy habits, mood, water and sleep — one small step a day.">
  <meta name="theme-color" content="#3E5C49">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Habits">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Healthy Habits</h1>
  </header>
  <main id="view" aria-live="polite"></main>
  <nav class="tabbar" aria-label="Sections">
    <button data-tab="today" class="active"><span class="ico">●</span>Today</button>
    <button data-tab="month"><span class="ico">▦</span>Month</button>
    <button data-tab="year"><span class="ico">⁘</span>Year</button>
    <button data-tab="reflect"><span class="ico">✎</span>Reflect</button>
    <button data-tab="settings"><span class="ico">⚙</span>Habits</button>
  </nav>
  <div id="toast" role="status"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
